---
services:
  db:
    image: sivavaddi2026/db:v1
    ports:
      - "3306:3306"
    enivironment:
      MYSQL_ROOT_PASSWORD: root
    deploy:
      replicas: 2
      resources:
        reservtions:
          cpus: "0.5"
          memory: 100M
        limits:
          cpus: "1.0"
          memory: 200M
     networks:
      - mynetwork

  frontend:
    image: sivavaddi2026/frontend:v1
    ports:
      - "1111:5000"
    deploy:
      replicas: 2
      resources:
        reservtions:
          cpus: "0.5"
          memory: 100M
        limits:
          cpus: "1.0"
          memory: 200M
     networks:
      - mynetwork
     depends_on:
       - auth_service
       - book_service
       - borrow_service


  auth_service:
    image: sivavaddi2026/auth:v1
    ports:
      - "1112:5001"
    deploy:
      replicas: 2
      resources:
        reservtions:
          cpus: "0.5"
          memory: 100M
        limits:
          cpus: "1.0"
          memory: 200M
     networks:
      - mynetwork
     depends_on:
       - db


  book_service:
    image: sivavaddi2026/book:v1
    ports:
      - "1113:5002"
    deploy:
      replicas: 2
      resources:
        reservtions:
          cpus: "0.5"
          memory: 100M
        limits:
          cpus: "1.0"
          memory: 200M
     networks:
      - mynetwork
     depends_on:
       - db


  borrow_service:
    image: sivavaddi2026/borrow:v1
    ports:
      - "1114:5003"
    deploy:
      replicas: 2
      resources:
        reservtions:
          cpus: "0.5"
          memory: 100M
        limits:
          cpus: "1.0"
          memory: 200M
     networks:
      - mynetwork
     depends_on:
       - db


networks:
  mynetwork:
    driver: overlay
